<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=3">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-inner">
                <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menu">☰</button>
                <a href="/" class="logo">ARBOR-CONVERTER.RU</a>
                <nav class="header-nav">
                    <a href="/calculator" class="header-nav-link">{{t "nav.calculator"}}</a>
                    <a href="/engineering" class="header-nav-link active">{{t "nav.engineering"}}</a>
                </nav>
                <div class="header-spacer"></div>
                <div class="lang-dropdown">
                    <button class="lang-dropdown-toggle" id="langToggle">
                        {{if eq .Lang "ru"}}
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2" class="flag-icon"><rect width="3" height="0.667" fill="#fff"/><rect y="0.667" width="3" height="0.666" fill="#0039A6"/><rect y="1.333" width="3" height="0.667" fill="#D52B1E"/></svg>
                        {{else}}
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" class="flag-icon"><rect width="60" height="30" fill="#012169"/><path fill="#FFF" d="M0 0l60 30M60 0L0 30" stroke="#FFF" stroke-width="6"/><path fill="#C8102E" d="M0 0l60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/><path fill="#FFF" d="M30 0v30M0 15h60"/><path fill="#C8102E" d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="2"/></g></svg>
                        {{end}}
                        <span class="lang-arrow">▼</span>
                    </button>
                    <div class="lang-dropdown-menu" id="langMenu">
                        <a href="/lang/ru" class="lang-dropdown-item {{if eq .Lang "ru"}}active{{end}}">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2" class="flag-icon"><rect width="3" height="0.667" fill="#fff"/><rect y="0.667" width="3" height="0.666" fill="#0039A6"/><rect y="1.333" width="3" height="0.667" fill="#D52B1E"/></svg>
                            <span>RU</span>
                        </a>
                        <a href="/lang/en" class="lang-dropdown-item {{if eq .Lang "en"}}active{{end}}">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" class="flag-icon"><rect width="60" height="30" fill="#012169"/><path fill="#FFF" d="M0 0l60 30M60 0L0 30" stroke="#FFF" stroke-width="6"/><path fill="#C8102E" d="M0 0l60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/><path fill="#FFF" d="M30 0v30M0 15h60"/><path fill="#C8102E" d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="2"/></g></svg>
                            <span>EN</span>
                        </a>
                    </div>
                </div>
            <div class="header-nav-mobile" id="headerNavMobile">
                <a href="/calculator" class="header-nav-link">{{t "nav.calculator"}}</a>
                <a href="/engineering" class="header-nav-link">{{t "nav.engineering"}}</a>
            </div>
          </div>
        </header>

        <div class="main home-main">
            <main class="home-content">
                <div class="home-header">
                    <h1 class="home-title">{{t "nav.engineering"}}</h1>
                    <p class="home-subtitle">Coming soon</p>
                </div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-inner">
                <p class="footer-text">© 2026 — Arbor-converter.ru — конвертеры единиц измерений</p>
            </div>
        </footer>
    </div>

    <script>
        (function() {
                        var mobileNavToggle = document.getElementById('mobileNavToggle');
            var mobileNav = document.getElementById('headerNavMobile');
            if (mobileNavToggle && mobileNav) {
                mobileNavToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    mobileNav.classList.toggle('open');
                });
                document.addEventListener('click', function(e) {
                    if (!mobileNav.contains(e.target) && e.target !== mobileNavToggle) {
                        mobileNav.classList.remove('open');
                    }
                });
            }

            var langToggle = document.getElementById('langToggle');
            var langMenu = document.getElementById('langMenu');
            if (langToggle && langMenu) {
                langToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    langMenu.classList.toggle('visible');
                });
                document.addEventListener('click', function() {
                    langMenu.classList.remove('visible');
                });
                langMenu.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            }
        })();
    </script>
</body>
</html>
